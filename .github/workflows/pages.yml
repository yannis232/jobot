name: Publier MoneyScout sur GitHub Pages
on:
  push:
    branches: [main]
    paths: ['pages/**', 'tests/pages*.mjs', 'scripts/build_pages.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/pages*.test.mjs
      - run: python3 scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
